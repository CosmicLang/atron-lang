# SPDX-License-Identifier: Apache-2.0
#
# golangci-lint configuration (schema version 2) for the Atron project.
#
# The linter set is the one required by chapter 3.4 of the Atron Master
# Implementation Guide: govet, staticcheck, errcheck, ineffassign, unused,
# revive, gocritic and gosec. Checks are not disabled to obtain a passing
# result. There is exactly one exception, with a stated reason:
#
#   * govet.fieldalignment — struct field ordering is a performance hint, not a
#     correctness requirement for the compiler front end. The value
#     representation it would police is benchmarked separately (ADR-0001).
#
# staticcheck runs with all checks enabled, including ST1000: every package has
# its package comment in `doc.go`, so the check passes on merit.
version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - revive
    - gocritic
    - gosec
    - misspell
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
    staticcheck:
      checks:
        - all
    revive:
      severity: warning
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unused-receiver
        - name: unreachable-code
        - name: redefines-builtin-id
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - commentFormatting
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec
          - revive
          - gocritic
    paths:
      - third_party$
      - builtin$
      - examples$

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
